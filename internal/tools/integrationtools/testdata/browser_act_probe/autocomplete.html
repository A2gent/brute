<!doctype html><html><head><meta charset="utf-8"><title>Destination autocomplete</title><link rel="stylesheet" href="style.css"><script src="oracle.js"></script></head><body>
<h1>Choose destination</h1><label>Destination <input id="destination" role="combobox" aria-controls="suggestions" aria-expanded="false" oninput="selected='';suggestions.hidden=false;this.setAttribute('aria-expanded','true')"></label><section id="suggestions" hidden><button role="option" onclick="selected='Paris, France';destination.value=selected;suggestions.hidden=true;destination.setAttribute('aria-expanded','false')">Paris, France</button><button role="option" onclick="selected='Paris, Texas';destination.value=selected;suggestions.hidden=true">Paris, Texas</button></section><button onclick="out.textContent=selected?'Destination confirmed: '+selected:'Select a suggestion first'">Confirm destination</button><output id="out">No destination confirmed</output>
<script>let selected='';window.probeTruth=()=>{let done=out.textContent==='Destination confirmed: Paris, France';return probe.truth(done?'confirmed':selected==='Paris, France'?'selected':destination.value==='Paris'?'typed':'empty',[probe.choice(done?'DONE':selected==='Paris, France'||destination.value==='Paris'?'CLICK':'TYPE_TEXT',done?'':selected==='Paris, France'?'Confirm destination':destination.value==='Paris'?'Paris, France':'Destination')],done,out.textContent)};</script></body></html>
