<!doctype html><html><head><meta charset="utf-8"><title>Appointment calendar</title><link rel="stylesheet" href="style.css"><script src="oracle.js"></script></head><body>
<h1>Choose appointment date</h1><button id="open" aria-expanded="false" onclick="days.hidden=false;this.setAttribute('aria-expanded','true')">Appointment date</button><section id="days" hidden><h2>October 2026</h2><button onclick="chosen='2026-10-14';pending.textContent='Selected October 14, 2026'">October 14, 2026</button><button onclick="chosen='2026-10-15';pending.textContent='Selected October 15, 2026'">October 15, 2026</button><button onclick="chosen='2026-10-16';pending.textContent='Selected October 16, 2026'">October 16, 2026</button><p id="pending">No day selected</p><button onclick="out.textContent='Confirmed date: '+chosen;days.hidden=true">Confirm date</button></section><output id="out">Date not confirmed</output>
<script>let chosen='';window.probeTruth=()=>{const done=out.textContent==='Confirmed date: 2026-10-15';return probe.truth(done?'confirmed':days.hidden?'closed':chosen==='2026-10-15'?'chosen':'open',[probe.choice(done?'DONE':'CLICK',done?'':days.hidden?'Appointment date':chosen==='2026-10-15'?'Confirm date':'October 15, 2026')],done,out.textContent+'; '+pending.textContent)};</script></body></html>
