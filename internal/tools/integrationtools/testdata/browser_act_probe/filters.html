<!doctype html><html><head><meta charset="utf-8"><title>Public filters</title><link rel="stylesheet" href="style.css"><script src="oracle.js"></script></head><body>
<h1>Public product filters (no login)</h1><label><input id="stock" type="checkbox">In stock only</label><label><input id="ship" type="checkbox" checked>Free shipping</label><label><input id="sale" type="checkbox">On sale</label><button onclick="out.textContent=stock.checked&&ship.checked?'Applied: in stock and free shipping':'Other filters applied'">Apply filters</button><output id="out">Filters not applied</output>
<script>window.probeTruth=()=>{let done=out.textContent==='Applied: in stock and free shipping'&&stock.checked&&ship.checked&&!sale.checked;let next=done?'':sale.checked?'On sale':!ship.checked?'Free shipping':!stock.checked?'In stock only':'Apply filters';return probe.truth(done?'applied':sale.checked||!ship.checked?'wrong_filters':stock.checked?'stock_checked':'initial',[probe.choice(done?'DONE':'CLICK',next)],done,JSON.stringify({stock:stock.checked,ship:ship.checked,sale:sale.checked,result:out.textContent}));};</script></body></html>
