<!doctype html><html><head><meta charset="utf-8"><title>Public contact form</title><link rel="stylesheet" href="style.css"><script src="oracle.js"></script></head><body>
<h1>Contact the public help desk</h1><label>Your name <input id="nameField" value="Previous visitor"></label><label>Email address <input id="email" type="email"></label><button onclick="out.textContent=nameField.value==='Ada'&&email.value==='ada@example.test'?'Message sent for Ada':'Required fields missing'">Send message</button><button onclick="nameField.value='';email.value='';out.textContent='Form cleared'">Clear form</button><output id="out">Not sent</output>
<script>window.probeTruth=()=>{let done=out.textContent==='Message sent for Ada';let op=done?'DONE':nameField.value!=='Ada'||email.value!=='ada@example.test'?'TYPE_TEXT':'CLICK';let label=done?'':nameField.value!=='Ada'?'Your name':email.value!=='ada@example.test'?'Email address':'Send message';let expected=[probe.choice(op,label)];if(!done&&nameField.value!=='Ada'&&email.value!=='ada@example.test')expected.push(probe.choice('TYPE_TEXT','Email address'));return probe.truth(done?'sent':nameField.value==='Ada'&&email.value==='ada@example.test'?'ready':'fields',expected,done,out.textContent)};</script></body></html>
