<!doctype html><html><head><meta charset="utf-8"><title>Deferred public results</title><link rel="stylesheet" href="style.css"><script src="oracle.js"></script></head><body>
<h1>Deferred report search</h1><button id="search" onclick="phase='loading';this.disabled=true;out.textContent='Loading results';readyAt=Date.now()+1500;setTimeout(()=>{phase='ready';result.hidden=false;out.textContent='One report found'},1500)">Find report</button><button id="result" hidden onclick="phase='opened';out.textContent='Annual report opened'">Annual report</button><output id="out">Search not started</output>
<script>let phase='initial',readyAt=0;window.probeTruth=()=>probe.truth(phase,[probe.choice(phase==='opened'?'DONE':phase==='loading'?'WAIT':'CLICK',phase==='opened'||phase==='loading'?'':phase==='ready'?'Annual report':'Find report')],phase==='opened',out.textContent);window.probeRecover=async()=>{if(phase==='loading')await new Promise(r=>setTimeout(r,Math.max(0,readyAt-Date.now())+100))};</script></body></html>
