<!doctype html><html><head><meta charset="utf-8"><title>Language menu</title><link rel="stylesheet" href="style.css"><script src="oracle.js"></script></head><body>
<h1>Public reading preferences</h1><button aria-expanded="false" onclick="menu.hidden=false;this.setAttribute('aria-expanded','true')">Choose language</button><section id="menu" role="menu" hidden><button role="menuitem" onclick="out.textContent='Language: English';menu.hidden=true">English</button><button role="menuitem" onclick="out.textContent='Language: French';menu.hidden=true">French</button><button role="menuitem" onclick="out.textContent='Language: Finnish';menu.hidden=true">Finnish</button></section><output id="out">Language: English</output>
<script>window.probeTruth=()=>probe.truth(out.textContent==='Language: French'?'french':menu.hidden?'closed':'open',[probe.choice(out.textContent==='Language: French'?'DONE':'CLICK',out.textContent==='Language: French'?'':menu.hidden?'Choose language':'French')],out.textContent==='Language: French',out.textContent);</script></body></html>
