<!doctype html><html><head><meta charset="utf-8"><title>Long public guide</title><link rel="stylesheet" href="style.css"><script src="oracle.js"></script></head><body>
<h1>Long public guide</h1><p>The Finish guide button is at the bottom of this page. Scroll down to find it.</p><button onclick="topOut.textContent='Guide restarted'">Restart guide</button><output id="topOut">Guide in progress</output><div class="spacer"></div><button id="finish" onclick="out.textContent='Guide complete'">Finish guide</button><output id="out">Guide not finished</output>
<script>window.probeTruth=()=>probe.truth(out.textContent==='Guide complete'?'complete':probe.visible('finish')?'button_visible':'above_button',[probe.choice(out.textContent==='Guide complete'?'DONE':probe.visible('finish')?'CLICK':'SCROLL_DOWN',out.textContent==='Guide complete'||!probe.visible('finish')?'':'Finish guide')],out.textContent==='Guide complete',out.textContent);</script></body></html>
