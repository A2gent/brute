<!doctype html><html><head><meta charset="utf-8"><title>Library search</title><link rel="stylesheet" href="style.css"><script src="oracle.js"></script></head><body>
<h1>Library catalogue</h1><label>Search query <input id="query" type="search"></label><button onclick="out.textContent='Results for '+query.value">Search</button><button onclick="out.textContent='Unrelated help'">Search help</button><output id="out">No search applied</output>
<script>window.probeTruth=()=>probe.truth(out.textContent==='Results for widgets'?'results':query.value==='widgets'?'ready':'empty',[probe.choice(out.textContent==='Results for widgets'?'DONE':query.value==='widgets'?'CLICK':'TYPE_TEXT',out.textContent==='Results for widgets'?'':query.value==='widgets'?'Search':'Search query')],out.textContent==='Results for widgets',out.textContent);</script></body></html>
