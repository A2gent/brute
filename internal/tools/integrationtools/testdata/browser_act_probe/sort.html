<!doctype html><html><head><meta charset="utf-8"><title>Article sorting</title><link rel="stylesheet" href="style.css"><script src="oracle.js"></script></head><body>
<h1>Sort public articles</h1><label>Sort by <select id="sort" onchange="out.textContent='Sorted by '+this.selectedOptions[0].textContent"><option value="relevance">Relevance</option><option value="old">Oldest</option><option value="new">Newest</option></select></label><output id="out">Sorted by Relevance</output>
<script>window.probeTruth=()=>probe.truth(sort.value==='new'?'newest':'other',[probe.choice(sort.value==='new'?'DONE':'SELECT',sort.value==='new'?'':'Sort by -> Newest')],sort.value==='new'&&out.textContent==='Sorted by Newest',out.textContent);</script></body></html>
