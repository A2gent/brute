<!doctype html><html><head><meta charset="utf-8"><title>Report tabs</title><link rel="stylesheet" href="style.css"><script src="oracle.js"></script></head><body>
<h1>Public reports</h1><button role="tab" aria-selected="true" onclick="details.hidden=true;overview.hidden=false">Overview</button><button id="detailsTab" role="tab" aria-selected="false" onclick="details.hidden=false;overview.hidden=true;this.setAttribute('aria-selected','true')">Details</button><section id="overview">Overview report</section><section id="details" hidden><h2>Detailed report</h2><button onclick="out.textContent='Detailed report expanded'">Expand report</button><button onclick="out.textContent='Summary report expanded'">Expand summary</button></section><output id="out">No report expanded</output>
<script>window.probeTruth=()=>probe.truth(out.textContent==='Detailed report expanded'?'expanded':details.hidden?'overview':'details',[probe.choice(out.textContent==='Detailed report expanded'?'DONE':'CLICK',out.textContent==='Detailed report expanded'?'':details.hidden?'Details':'Expand report')],out.textContent==='Detailed report expanded'&&!details.hidden,out.textContent);</script></body></html>
